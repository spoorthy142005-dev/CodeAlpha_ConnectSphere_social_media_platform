name: ConnectSphere Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Production Readiness Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: connectsphere_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Consistency Check
        run: |
          python manage.py check

      - name: Migration Completeness Check
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Production Deployment Security Audit
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-validation-secret-key-with-strictly-more-than-fifty-characters-for-audit-safety"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://testserver"
        run: |
          python manage.py check --deploy

      - name: WhiteNoise Static Assets Collection & Manifest Validation
        run: |
          python manage.py collectstatic --noinput

      - name: Apply Database Migrations on PostgreSQL 16
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/connectsphere_ci
        run: |
          python manage.py migrate --noinput

      - name: Execute Automated Test Suite (PostgreSQL 16)
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/connectsphere_ci
        run: |
          python manage.py test --verbosity=2
