{% extends 'base.html' %}

{% block title %}Delete Comment - ConnectSphere{% endblock %}

{% block content %}
<div class="app-layout app-layout-auth">
  <div class="sidebar-card" style="border-top: 4px solid var(--danger);">
    <h1 style="font-size: 1.25rem; color: var(--danger); font-weight: 700; margin-bottom: 0.75rem;">
      Delete Comment
    </h1>
    
    <p style="color: var(--text-main); margin-bottom: 1rem; font-size: 0.9rem;">
      Are you sure you want to delete this comment?
    </p>

    <div style="background-color: var(--bg-subtle); padding: 0.75rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.875rem;">
      "{{ comment.content }}"
    </div>

    <form method="post" id="comment-delete-form">
      {% csrf_token %}
      <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
        <a href="{% url 'posts:post_detail' post_id=comment.post_id %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger" id="btn-confirm-delete-comment">Delete</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
