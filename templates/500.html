<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error (500) - ConnectSphere</title>
  <style>
    :root {
      --navy-dark: #101323;
      --primary: #6558F5;
      --bg: #F7F6F2;
      --surface: #FFFFFF;
      --text-muted: #5C6479;
      --border: #E2E0D8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--navy-dark);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .error-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem 2rem;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(16, 19, 35, 0.06);
      margin: 1rem;
    }
    .error-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">⚡</div>
    <h1>Something Went Wrong (500)</h1>
    <p>
      An unexpected internal server error occurred while processing your request. Our engineering team has been notified. Please try refreshing or return to the application.
    </p>
    <a href="/" class="btn">Return to ConnectSphere</a>
  </div>
</body>
</html>
